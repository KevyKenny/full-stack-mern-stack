<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up | Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #667eea;
    --secondary: #764ba2;
    --danger: #ff4d4f;
    --text-dark: #333;
    --text-muted: #555;
    --input-border: #e5e5e5;
    --focus-ring: rgba(102, 126, 234, 0.15);
    --card-bg: #ffffff;
    --nav-bg: rgba(255, 255, 255, 0.95);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card-bg: #1e2130;
      --input-bg: #2a2d3a;
      --text-dark: #f3f4f6;
      --text-muted: #c5c8d3;
      --input-border: #3d4154;
      --focus-ring: rgba(139, 156, 247, 0.25);
      --nav-bg: rgba(30, 33, 48, 0.95);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: var(--text-dark);
  }
  a { color: inherit; text-decoration: none; }
  .navbar {
    background: var(--nav-bg); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .nav-inner {
    max-width: 960px; margin: 0 auto; display: flex; align-items: center;
    justify-content: space-between; padding: 16px 24px;
  }
  .brand { font-weight: 700; font-size: 20px; color: var(--primary); }
  .nav-links { display: flex; gap: 8px; list-style: none; }
  .nav-links a {
    padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 15px;
    color: var(--text-muted); transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-links a:hover { background: var(--focus-ring); color: var(--primary); }
  .nav-links a.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
  .hamburger {
    display: none; background: none; border: none; font-size: 28px; line-height: 1;
    cursor: pointer; color: var(--primary); padding: 4px 8px; border-radius: 8px;
  }
  .hamburger:focus-visible, .nav-links a:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid var(--primary); outline-offset: 2px;
  }
  @media (max-width: 768px) {
    .nav-links { display: none; flex-direction: column; width: 100%; padding: 8px 24px 16px; }
    .nav-links.open { display: flex; }
    .nav-links a { display: flex; align-items: center; min-height: 44px; }
    .nav-inner { flex-wrap: wrap; }
    .hamburger { display: block; }
  }
  main { max-width: 560px; margin: 40px auto; padding: 0 20px 60px; }
  .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); padding: 36px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--primary);
    margin-bottom: 8px;
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .subtext { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

  .alert {
    display: none;
    background: rgba(255,77,79,0.1);
    border: 1px solid rgba(255,77,79,0.3);
    color: #c0392b;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  @media (prefers-color-scheme: dark) { .alert { color: #ff8b8d; } }

  .row { display: flex; gap: 12px; }
  .field { margin-bottom: 18px; flex: 1; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .field .optional { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--input-border);
    background: var(--input-bg, #fff); color: var(--text-dark); font-family: inherit; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 72px; }
  .toggle-pw {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--primary); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 6px 8px; border-radius: 6px;
  }
  .toggle-pw:hover { background: var(--focus-ring); }

  .btn {
    border: none; border-radius: 10px; font-weight: 600; font-family: inherit; font-size: 15px;
    cursor: pointer; padding: 13px 20px; transition: transform 0.1s ease, box-shadow 0.15s ease;
    width: 100%;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35); margin-top: 6px;
  }
  .footer-link { text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 20px; }
  .footer-link a { color: var(--primary); font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }

  @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="brand">Task Manager</div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="sign-up.html" class="active">Sign up</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="card">
    <p class="eyebrow">Task Manager</p>
    <h1>Create your account</h1>
    <p class="subtext">Sign up to start managing your tasks.</p>

    <div class="alert" id="errorAlert" role="alert">That email is already registered. Try logging in instead.</div>

    <form onsubmit="return false;">
      <div class="row">
        <div class="field">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" required>
          <button type="button" class="toggle-pw" data-target="password">Show</button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" required>
          <button type="button" class="toggle-pw" data-target="confirmPassword">Show</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="department">Department <span class="optional">(optional)</span></label>
          <input type="text" id="department" name="department" placeholder="e.g. Computer Science">
        </div>
        <div class="field">
          <label for="jobTitle">Job title <span class="optional">(optional)</span></label>
          <input type="text" id="jobTitle" name="jobTitle" placeholder="e.g. Student">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Sign up</button>
    </form>

    <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script>
  const hb = document.getElementById('hamburgerBtn');
  const links = document.getElementById('navLinks');
  hb.addEventListener('click', () => {
    const isOpen = links.classList.toggle('open');
    hb.setAttribute('aria-expanded', isOpen);
  });
  links.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      links.classList.remove('open');
      hb.setAttribute('aria-expanded', 'false');
    });
  });

  document.querySelectorAll('.toggle-pw').forEach(button => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.target);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      button.textContent = isPassword ? 'Hide' : 'Show';
    });
  });
</script>
</body>
</html>
